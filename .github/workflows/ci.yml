name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm install (not `npm ci`): platform-specific optional deps (@emnapi/*
      # for sharp / Next image optimizer) resolve to different versions on the
      # Linux runner than on the dev machine, so a committed lockfile drifts.
      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: npm run build
